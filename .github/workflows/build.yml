name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test + build debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace 2>&1 | tee build.log

      # При ошибке кладём лог в ветку ci-logs, чтобы его можно было прочитать через git
      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          tail -c 300000 build.log > /tmp/LAST_BUILD_LOG.txt || echo "no log" > /tmp/LAST_BUILD_LOG.txt
          git checkout --orphan ci-logs
          git rm -rf --cached . > /dev/null
          cp /tmp/LAST_BUILD_LOG.txt LAST_BUILD_LOG.txt
          git add LAST_BUILD_LOG.txt
          git commit -m "build log ${{ github.sha }}"
          git push -f origin ci-logs

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AirTouch.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AirTouch build ${{ github.run_number }}
          body: "Скачайте AirTouch.apk на телефон и установите."
          files: AirTouch.apk
          make_latest: true

  # «Проверяющий»: настоящий Android-эмулятор, сквозные тесты без камеры.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run tests on emulator
        id: emu
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            chmod +x gradlew
            ./gradlew :app:connectedDebugAndroidTest --stacktrace > e2e.log 2>&1 || touch e2e_failed
            adb logcat -d > logcat.txt || true
            adb exec-out screencap -p > screen.png || true

      - name: Publish e2e report
        if: always()
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          mkdir -p /tmp/rep
          cp e2e.log /tmp/rep/ 2>/dev/null || echo "no e2e.log" > /tmp/rep/e2e.log
          grep -E "AirTouch|AndroidRuntime|TestRunner|AccessibilityService" logcat.txt | tail -n 3000 > /tmp/rep/logcat.txt 2>/dev/null || true
          cp screen.png /tmp/rep/ 2>/dev/null || true
          find app/build/outputs/androidTest-results -name "*.xml" -exec cp {} /tmp/rep/ \; 2>/dev/null || true
          if [ -f e2e_failed ] || [ "${{ steps.emu.outcome }}" != "success" ]; then echo FAILED > /tmp/rep/RESULT; else echo PASSED > /tmp/rep/RESULT; fi
          echo "${{ github.sha }}" >> /tmp/rep/RESULT
          git checkout --orphan ci-e2e
          git rm -rf --cached . > /dev/null
          cp /tmp/rep/* .
          git add RESULT e2e.log logcat.txt *.xml screen.png 2>/dev/null || git add RESULT e2e.log
          git commit -m "e2e ${{ github.sha }}"
          git push -f origin ci-e2e

      - name: Fail if e2e failed
        run: test ! -f e2e_failed && test "${{ steps.emu.outcome }}" = "success"
